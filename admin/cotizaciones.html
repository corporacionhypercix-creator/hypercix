<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYPERCIX | Cotizaciones</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23cc0000'/%3E%3Ctext x='16' y='22' fill='%23fff' font-family='Arial' font-weight='800' font-size='13' text-anchor='middle'%3EHC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/store-sync.js?v=2"></script>
  <script src="../js/ui-kit.js"></script>
  <style>
    .quote-status { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
    .status-pending { background: #3a2f0e; color: #fbbf24; }
    .status-approved { background: #0a2e1a; color: #34d399; }
    .status-rejected { background: #3a0e0e; color: #f87171; }
    .light-admin .status-pending { background: #fef3c7; color: #92400e; }
    .light-admin .status-approved { background: #d1fae5; color: #065f46; }
    .light-admin .status-rejected { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="admin-product-page">
<div class="admin-layout">

  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">HC</div>
      <span>HYPERCIX</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Principal</div>
      <a href="dashboard.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="7" height="7" rx="1.5"/><rect x="10" y="1" width="7" height="7" rx="1.5"/><rect x="1" y="10" width="7" height="7" rx="1.5"/><rect x="10" y="10" width="7" height="7" rx="1.5"/></svg></span>
        Dashboard
      </a>
      <a href="productos.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1l7 3.5v9L9 17 2 13.5v-9z"/><path d="M9 1v7.5M2 4.5l7 4 7-4"/></svg></span>
        Productos
      </a>
      <a href="categorias.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1h7v7H1zM10 1h7v7h-7zM1 10h7v7H1zM10 10h7v7h-7z"/></svg></span>
        Categor&#237;as
      </a>
      <a href="marcas.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="9,1 11.8,6.6 18,7.5 13.5,11.8 14.6,17.9 9,15 3.4,17.9 4.5,11.8 0,7.5 6.2,6.6"/></svg></span>
        Marcas
      </a>
      <div class="nav-section">Gesti&#243;n</div>
      <a href="clientes.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="3"/><path d="M1 17c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5"/><circle cx="14" cy="6" r="2"/><path d="M17 17c0-2-1-4-3-4.5"/></svg></span>
        Clientes
      </a>
      <a class="active" href="cotizaciones.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1H4a1 1 0 00-1 1v14a1 1 0 001 1h10a1 1 0 001-1V6z"/><path d="M10 1v5h5M6 10h6M6 13h4"/></svg></span>
        Cotizaciones
      </a>
      <a href="inventario.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12l8 4 8-4M1 8l8 4 8-4M9 1L1 5l8 4 8-4z"/></svg></span>
        Inventario
      </a>
      <a href="banners.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="16" height="12" rx="2"/><path d="M1 7h16"/></svg></span>
        Banners
      </a>
      <div class="nav-section">Sistema</div>
      <a href="tipocambio.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4-4 3 3 5-6"/><circle cx="14" cy="7" r="2"/></svg></span>
        Tipo Cambio
      </a>
      <a href="configuracion.html">
        <span class="nav-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="2.5"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.1 3.1l1.4 1.4M13.5 13.5l1.4 1.4M14.9 3.1l-1.4 1.4M4.5 13.5l-1.4 1.4"/></svg></span>
        Configuraci&#243;n
      </a>
    </nav>
    <div class="sidebar-footer">
      <span style="color:var(--success);font-size:0.6rem">&#9679;</span> Sistema activo
      <a href="../public/index.html" style="margin-left:auto">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:13px;height:13px;vertical-align:middle"><path d="M10 3h3a1 1 0 011 1v8a1 1 0 01-1 1h-3M7 11l4-3-4-3M1 8h9"/></svg>
        Salir
      </a>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="admin-title">
        <p id="current-date">HYPERCIX CONTROL PANEL</p>
        <h1><span class="highlight"><svg viewBox="0 0 16 16" fill="currentColor" style="width:14px;height:14px;vertical-align:middle;color:var(--primary-light)"><polygon points="8,1 10,6 15,6.5 11.5,10 12.5,15 8,12.5 3.5,15 4.5,10 1,6.5 6,6"/></svg></span> Cotizaciones</h1>
      </div>
      <label class="admin-search">
        <span aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:14px;height:14px;opacity:0.6"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10.5 10.5L14 14"/></svg></span>
        <input id="quote-search" type="search" placeholder="Buscar cotizaciones..." />
      </label>
      <div class="admin-actions">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu"><svg viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:14px"><line x1="0" y1="2" x2="18" y2="2"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="12" x2="18" y2="12"/></svg></button>
        <button type="button" class="toolbar-button" id="new-quote-button">
          <span aria-hidden="true">+</span> Nueva
        </button>
        <button type="button" class="toolbar-button" id="theme-button">
          <span aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:13px;height:13px;vertical-align:middle"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M11.5 4.5l1.4-1.4M3.1 12.9l1.4-1.4"/></svg></span> Tema
        </button>
      </div>
    </header>

  <main class="admin-workspace" style="grid-template-columns:minmax(320px,500px) minmax(560px,1fr);">
    <section class="admin-panel" aria-labelledby="quote-form-title">
      <div class="panel-heading">
        <h2 id="quote-form-title">Nueva cotización</h2>
      </div>
      <form id="quote-form" autocomplete="off" style="padding:1.35rem 1.45rem;">
        <input type="hidden" id="editing-id" />
        <div class="product-form-grid">
          <label class="field">
            <span>Cliente</span>
            <input id="quote-client" type="text" required />
          </label>
          <label class="field">
            <span>Correo</span>
            <input id="quote-email" type="email" />
          </label>
          <label class="field">
            <span>Teléfono</span>
            <input id="quote-phone" type="text" />
          </label>
          <label class="field">
            <span>Producto / Servicio</span>
            <input id="quote-product" type="text" required />
          </label>
          <label class="field field-wide">
            <span>Descripción</span>
            <input id="quote-description" type="text" />
          </label>
          <label class="field">
            <span>Monto</span>
            <input id="quote-amount" type="number" min="0" step="0.01" required />
          </label>
          <label class="field">
            <span>Estado</span>
            <select id="quote-status">
              <option value="pendiente">Pendiente</option>
              <option value="aprobada">Aprobada</option>
              <option value="rechazada">Rechazada</option>
            </select>
          </label>
        </div>
        <div class="form-actions" style="margin-top:1rem;">
          <button class="btn-primary" type="submit" id="submit-quote">Guardar cotización</button>
          <button class="btn-secondary" type="button" id="clear-form">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="admin-panel" aria-labelledby="quote-list-title">
      <div class="panel-heading">
        <h2 id="quote-list-title">Listado</h2>
      </div>
      <div class="listing-tools" style="grid-template-columns:1fr auto;">
        <select id="quote-status-filter">
          <option value="">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="aprobada">Aprobada</option>
          <option value="rechazada">Rechazada</option>
        </select>
      </div>
      <div class="table-wrap" style="padding:0 1.45rem 1.35rem;">
        <table class="product-table">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Contacto</th>
              <th>Producto</th>
              <th>Monto</th>
              <th>Estado</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="quote-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('current-date').textContent = 'HYPERCIX CONTROL PANEL · ' + new Date().toLocaleDateString('es-PE', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
    const themeBtn = document.getElementById('theme-button');
    if (localStorage.getItem('hypercix-admin-theme') === 'dark') document.body.classList.add('light-admin');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-admin');
      localStorage.setItem('hypercix-admin-theme', document.body.classList.contains('light-admin') ? 'dark' : 'light');
    });
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    if (sidebarToggle && sidebarOverlay) {
      sidebarToggle.addEventListener('click', () => {
        document.body.classList.toggle('sidebar-open');
      });
      sidebarOverlay.addEventListener('click', () => {
        document.body.classList.remove('sidebar-open');
      });
    }
  </script>
  <script src="../js/admin-cotizaciones.js"></script>
</div><!-- /admin-main -->
</div><!-- /admin-layout -->
</body>
</html>
