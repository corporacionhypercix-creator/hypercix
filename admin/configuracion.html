  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="admin-title">
        <p id="current-date">HYPERCIX CONTROL PANEL</p>
        <h1><span class="highlight"><svg viewBox="0 0 16 16" fill="currentColor" style="width:14px;height:14px;vertical-align:middle;color:var(--primary-light)"><polygon points="8,1 10,6 15,6.5 11.5,10 12.5,15 8,12.5 3.5,15 4.5,10 1,6.5 6,6"/></svg></span> Configuración</h1>
      </div>
      <div class="admin-actions">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu"><svg viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:14px"><line x1="0" y1="2" x2="18" y2="2"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="12" x2="18" y2="12"/></svg></button>
        <button type="button" class="toolbar-button" id="theme-button">
          <span aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:13px;height:13px;vertical-align:middle"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M11.5 4.5l1.4-1.4M3.1 12.9l1.4-1.4"/></svg></span> Tema
        </button>
      </div>
    </header>

    <main style="max-width:800px;margin:0 auto;padding:1.6rem 2rem;">
    <section class="admin-panel">
      <div class="panel-heading">
        <h2>Ajustes del sistema</h2>
      </div>
      <form id="settings-form" autocomplete="off" style="padding:1.35rem 1.45rem;">
        <div class="settings-section">
          <h3>Información de la tienda</h3>
          <div class="product-form-grid">
            <label class="field field-wide">
              <span>Logo URL (imagen)</span>
              <input id="sett-logo" type="text" placeholder="https://ejemplo.com/logo.png" />
            </label>
            <div id="logo-preview" style="margin:0 0 0.6rem;display:flex;align-items:center;gap:0.6rem;min-height:40px">
              <span style="font-size:0.8rem;color:var(--admin-muted)">Vista previa:</span>
            </div>
            <label class="field">
              <span>Nombre de tienda</span>
              <input id="sett-store-name" type="text" required />
            </label>
            <label class="field">
              <span>Correo de contacto</span>
              <input id="sett-email" type="email" />
            </label>
            <label class="field">
              <span>Teléfono</span>
              <input id="sett-phone" type="text" />
            </label>
            <label class="field field-wide">
              <span>Dirección</span>
              <input id="sett-address" type="text" />
            </label>
          </div>
        </div>

        <div class="settings-section">
          <h3>Moneda e impuestos</h3>
          <div class="product-form-grid">
            <label class="field">
              <span>Símbolo de moneda</span>
              <input id="sett-currency" type="text" maxlength="5" />
            </label>
            <label class="field">
              <span>Código de moneda</span>
              <input id="sett-currency-code" type="text" maxlength="3" />
            </label>
            <label class="field">
              <span>Impuesto (%)</span>
              <input id="sett-tax-rate" type="number" min="0" max="100" step="0.1" />
            </label>
            <label class="field">
              <span>Nombre del impuesto</span>
              <input id="sett-tax-name" type="text" />
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-primary" type="submit">Guardar configuración</button>
          <button class="btn-secondary" type="button" id="reset-settings">Restaurar valores por defecto</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('current-date').textContent = 'HYPERCIX CONTROL PANEL · ' + new Date().toLocaleDateString('es-PE', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
    const themeBtn = document.getElementById('theme-button');
    if (localStorage.getItem('hypercix-admin-theme') === 'dark') document.body.classList.add('light-admin');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-admin');
      localStorage.setItem('hypercix-admin-theme', document.body.classList.contains('light-admin') ? 'dark' : 'light');
    });
    const toggleBtn = document.getElementById('sidebar-toggle');
    const overlay = document.getElementById('sidebar-overlay');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('sidebar-open');
    });
    overlay.addEventListener('click', () => {
      document.body.classList.remove('sidebar-open');
    });
  </script>
  <script src="../js/admin-configuracion.js"></script>
</div><!-- /admin-main -->
</div><!-- /admin-layout -->
</body>
</html>
