<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYPERCIX | Acceso administrativo</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/store-sync.js"></script>
  <script src="../js/ui-kit.js"></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E01233'/%3E%3Ctext x='16' y='22' fill='%23fff' font-family='Arial' font-weight='800' font-size='13' text-anchor='middle'%3EHC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form" novalidate>
      <div class="login-brand">
        <div class="brand-icon-lg">HC</div>
        <h1>HYPERCIX</h1>
        <p>Panel administrativo</p>
      </div>
      <div class="login-form">
        <div class="login-field">
          <label for="username">Usuario</label>
          <input id="username" type="text" autocomplete="username" placeholder="admin" required />
        </div>
        <div class="login-field">
          <label for="password">Contrasena</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="********" required />
        </div>
        <p class="login-error" id="login-error" aria-live="polite"></p>
        <button class="login-btn btn-primary" id="login-btn" type="submit">Ingresar al panel</button>
      </div>
      <div class="login-footer">Acceso por defecto: <strong>admin</strong> / <strong>admin123</strong></div>
    </form>
  </div>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var errorEl = document.getElementById('login-error');
      var btn = document.getElementById('login-btn');

      if (window.HCAuth && window.HCAuth.token()) {
        location.replace('dashboard.html');
        return;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.textContent = '';
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        if (!username || !password) { errorEl.textContent = 'Completa usuario y contrasena.'; return; }
        btn.disabled = true; btn.textContent = 'Ingresando...';
        setTimeout(function () {
          if (username === 'admin' && password === 'admin123') {
            window.HCAuth.setSession('local-' + Date.now(), { username: 'admin', role: 'admin' });
            location.replace('dashboard.html');
          } else {
            errorEl.textContent = 'Credenciales incorrectas';
            btn.disabled = false; btn.textContent = 'Ingresar al panel';
          }
        }, 400);
      });
    })();
  </script>
</body>
</html>
